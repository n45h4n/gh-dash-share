defaults:
  issuesLimit: 20
  notificationsLimit: 20
  prApproveComment: LGTM
  preview:
    open: false
    position: right
    width: 0.7
  prsLimit: 20
  refetchIntervalMinutes: 30
  view: prs
keybindings:
  prs:
    - key: I
      name: review PR in Codex
      command: >-
        "${DOTFILES_DIR:?run through ghd}/scripts/integrations/gh-dash/gh-dash-codex-pr-review.sh" "{{.RepoName}}" "{{.PrNumber}}"
  issues:
    - key: I
      name: implement issue with Codex
      command: >-
        "${DOTFILES_DIR:?run through ghd}/scripts/integrations/gh-dash/gh-dash-codex-issue-dispatch.sh" "{{.RepoName}}" "{{.IssueNumber}}"
